<!-- header.html -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container-fluid">

    <!-- Logo/Brand -->
    <a class="navbar-brand d-flex align-items-center" routerLink="/" title="Go to Dashboard">
      <img
        src="https://prontomoto.azureedge.net/artifacts/prontomoto_icon.png"
        alt="ProntoMoto Icon"
        width="42"
        height="42"
        class="me-2"
      />
      <span class="navbar-title">
        <span style="color: #4CAF50; font-weight: 600;">Pronto</span>
        <span style="color: #FF5252; font-weight: 600;">Moto</span>
      </span>
    </a>

    <!-- User Welcome Text (Hidden on Mobile) -->
    <span class="navbar-text ms-3 me-auto d-none d-lg-inline" *ngIf="userName$ | async as uname">
      👤 Hello, <strong>{{ uname }}</strong>
    </span>

    <!-- Navbar Toggler for Mobile -->
    <button
      class="navbar-toggler"
      type="button"
      data-bs-toggle="collapse"
      data-bs-target="#navbarSupportedContent"
      aria-controls="navbarSupportedContent"
      aria-expanded="false"
      aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>

    <!-- Navigation Items Container -->
    <div class="collapse navbar-collapse" id="navbarSupportedContent">
      <ul class="navbar-nav ms-auto mb-2 mb-lg-0 align-items-center" style="gap: 0;">

        <!-- Dashboard Link -->
        <li class="nav-item">
          <a 
            class="nav-link nav-link-custom" 
            routerLink="/" 
            routerLinkActive="active"
            [routerLinkActiveOptions]="{ exact: true }"
            title="View Dashboard">
            📊 Dashboard
          </a>
        </li>

        <!-- Stakeholder Link (Conditional) -->
        <li class="nav-item" *ngIf="canEditStakeholder$ | async">
          <a 
            class="nav-link nav-link-custom" 
            routerLink="/stakeholder" 
            routerLinkActive="active"
            title="View Stakeholders">
            👥 Stakeholder
          </a>
        </li>

        <!-- Users Dropdown (Admin Only) -->
        <li class="nav-item dropdown" *ngIf="isAdmin$ | async">
          <a 
            class="nav-link dropdown-toggle nav-link-custom" 
            role="button"
            data-bs-toggle="dropdown" 
            aria-expanded="false"
            title="Users Management">
            👤 Users
            <span class="dropdown-arrow-icon">▼</span>
          </a>
          <ul class="dropdown-menu dropdown-menu-dark" style="min-width: 200px;">
            <li>
              <a 
                class="dropdown-item dropdown-item-custom" 
                routerLink="/users" 
                routerLinkActive="active"
                title="View and manage all users">
                📋 Manage Users
              </a>
            </li>
            <li>
              <hr class="dropdown-divider">
            </li>
            <li>
              <a 
                class="dropdown-item dropdown-item-custom" 
                routerLink="/users/add" 
                routerLinkActive="active"
                title="Add a new user">
                ➕ Add User
              </a>
            </li>
          </ul>
        </li>

        <!-- Logout Link -->
        <li class="nav-item">
          <a 
            class="nav-link nav-link-custom" 
            (click)="onLogout()" 
            role="button"
            title="Logout from application">
            🚪 Logout
          </a>
        </li>

      </ul>
    </div>

  </div>
</nav>
